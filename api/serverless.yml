# Rosterush API — Serverless Framework v4
# stage: local(serverless-offline) / dev / prod
service: rosterush
frameworkVersion: "4"

# stage별 기본값
# - dev/prod는 환경변수 IP_HASH_SECRET 필수 (api/.env.{stage} 또는 셸 환경변수). 없으면 배포 실패
params:
  local:
    dynamodbEndpoint: http://localhost:8000
    ipHashSecret: local-only-secret
    originVerifySecret: ""
    minSample: 100
  default:
    dynamodbEndpoint: ""
    ipHashSecret: ${env:IP_HASH_SECRET}
    originVerifySecret: ""
    minSample: 100

plugins:
  - serverless-offline

provider:
  name: aws
  profile: rosterush
  runtime: nodejs24.x
  region: ap-northeast-2
  stage: ${opt:stage, 'dev'}
  architecture: arm64
  memorySize: 512
  timeout: 10
  logRetentionInDays: 14
  environment:
    STAGE: ${self:provider.stage}
    IP_HASH_SECRET: ${param:ipHashSecret}
    ORIGIN_VERIFY_SECRET: ${env:ORIGIN_VERIFY_SECRET, param:originVerifySecret}
    DYNAMODB_ENDPOINT: ${env:DYNAMODB_ENDPOINT, param:dynamodbEndpoint}
    STATS_BUCKET: !Ref StatsBucket
    MIN_SAMPLE: ${param:minSample}
  httpApi:
    payload: "2.0"
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:TransactWriteItems
          Resource:
            - !GetAtt ResultsTable.Arn
            - !GetAtt SharesTable.Arn
            - !GetAtt CommentsTable.Arn
            - !GetAtt RateLimitsTable.Arn
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
          Resource:
            - !Sub "${StatsBucket.Arn}/*"
        # 없는 키를 읽을 때 AccessDenied 대신 NoSuchKey를 받기 위해 필요
        - Effect: Allow
          Action:
            - s3:ListBucket
          Resource:
            - !GetAtt StatsBucket.Arn

build:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true

functions:
  results:
    handler: src/results.main
    events:
      - httpApi:
          method: POST
          path: /api/results

  # 증분 집계 (UTC 기준 cron)
  # 일·수 19:00 UTC = 한국 시간 월·목 04:00 → 주 2회
  # 나중에 주 1회로 줄일 때: cron(0 19 ? * SUN *) (한국 시간 월 04:00)
  aggregate:
    handler: src/aggregate.main
    timeout: 300
    memorySize: 1024
    events:
      - schedule: cron(0 19 ? * SUN,WED *)

custom:
  serverless-offline:
    httpPort: 4000
    noPrependStageInUrl: true

# 키 스키마는 src/lib/tables.ts (로컬 생성용)와 동일하게 유지
resources:
  Resources:
    # 집계 결과: internal/ (state, 비공개) + stats/ (CloudFront로 공개 예정)
    StatsBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: rosterush-${self:provider.stage}-stats-${aws:accountId}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        VersioningConfiguration:
          Status: Enabled

    ResultsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: rosterush-${self:provider.stage}-results
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - { AttributeName: pk, AttributeType: S }
          - { AttributeName: sk, AttributeType: S }
        KeySchema:
          - { AttributeName: pk, KeyType: HASH }
          - { AttributeName: sk, KeyType: RANGE }
        TimeToLiveSpecification:
          AttributeName: expiresAt
          Enabled: true

    SharesTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      Properties:
        TableName: rosterush-${self:provider.stage}-shares
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - { AttributeName: shareId, AttributeType: S }
        KeySchema:
          - { AttributeName: shareId, KeyType: HASH }
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true

    CommentsTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      Properties:
        TableName: rosterush-${self:provider.stage}-comments
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - { AttributeName: pk, AttributeType: S }
          - { AttributeName: sk, AttributeType: S }
        KeySchema:
          - { AttributeName: pk, KeyType: HASH }
          - { AttributeName: sk, KeyType: RANGE }

    RateLimitsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: rosterush-${self:provider.stage}-ratelimits
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - { AttributeName: pk, AttributeType: S }
        KeySchema:
          - { AttributeName: pk, KeyType: HASH }
        TimeToLiveSpecification:
          AttributeName: expiresAt
          Enabled: true
