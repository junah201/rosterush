# Rosterush API — Serverless Framework v4
# stage: local(serverless-offline) / dev / prod
service: rosterush
frameworkVersion: "4"

# stage별 기본값
# - dev/prod는 환경변수 IP_HASH_SECRET, ORIGIN_VERIFY_SECRET 필수 (api/.env.{stage} 또는 셸 환경변수). 없으면 배포 실패
params:
  local:
    domain: localhost
    dynamodbEndpoint: http://localhost:8000
    ipHashSecret: local-only-secret
    originVerifySecret: ""
    minSample: 100
  # 비밀값은 dev/prod 블록에만 둔다 (default에 두면 local stage에서도 값을 요구해 실패함)
  dev:
    domain: rosterush-dev.junah.dev
    ipHashSecret: ${env:IP_HASH_SECRET}
    originVerifySecret: ${env:ORIGIN_VERIFY_SECRET}
  prod:
    domain: rosterush.junah.dev
    ipHashSecret: ${env:IP_HASH_SECRET}
    originVerifySecret: ${env:ORIGIN_VERIFY_SECRET}
  default:
    # CloudFront용 us-east-1 인증서 (rosterush.junah.dev + rosterush-dev.junah.dev)
    certificateArn: arn:aws:acm:us-east-1:805892673937:certificate/3e36e5c0-4386-439a-8f46-5d0967f9aaa9
    dynamodbEndpoint: ""
    minSample: 100

plugins:
  - serverless-offline

provider:
  name: aws
  profile: rosterush
  runtime: nodejs24.x
  region: ap-northeast-2
  stage: ${opt:stage, 'dev'}
  architecture: arm64
  memorySize: 512
  timeout: 10
  logRetentionInDays: 14
  environment:
    STAGE: ${self:provider.stage}
    IP_HASH_SECRET: ${param:ipHashSecret}
    ORIGIN_VERIFY_SECRET: ${param:originVerifySecret}
    DYNAMODB_ENDPOINT: ${env:DYNAMODB_ENDPOINT, param:dynamodbEndpoint}
    STATS_BUCKET: !Ref StatsBucket
    MIN_SAMPLE: ${param:minSample}
  httpApi:
    payload: "2.0"
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:TransactWriteItems
          Resource:
            - !GetAtt ResultsTable.Arn
            - !GetAtt SharesTable.Arn
            - !GetAtt CommentsTable.Arn
            - !GetAtt RateLimitsTable.Arn
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
          Resource:
            - !Sub "${StatsBucket.Arn}/*"
        # 없는 키를 읽을 때 AccessDenied 대신 NoSuchKey를 받기 위해 필요
        - Effect: Allow
          Action:
            - s3:ListBucket
          Resource:
            - !GetAtt StatsBucket.Arn

build:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true

functions:
  results:
    handler: src/results.main
    events:
      - httpApi:
          method: POST
          path: /api/results

  # 증분 집계 (UTC 기준 cron)
  # 일·수 19:00 UTC = 한국 시간 월·목 04:00 → 주 2회
  # 나중에 주 1회로 줄일 때: cron(0 19 ? * SUN *) (한국 시간 월 04:00)
  aggregate:
    handler: src/aggregate.main
    timeout: 300
    memorySize: 1024
    events:
      - schedule: cron(0 19 ? * SUN,WED *)

custom:
  serverless-offline:
    httpPort: 4000
    noPrependStageInUrl: true

# 키 스키마는 src/lib/tables.ts (로컬 생성용)와 동일하게 유지
resources:
  Resources:
    # 집계 결과: internal/ (state, 비공개) + stats/ (CloudFront로 공개 예정)
    StatsBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: rosterush-${self:provider.stage}-stats-${aws:accountId}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        VersioningConfiguration:
          Status: Enabled

    ResultsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: rosterush-${self:provider.stage}-results
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - { AttributeName: pk, AttributeType: S }
          - { AttributeName: sk, AttributeType: S }
        KeySchema:
          - { AttributeName: pk, KeyType: HASH }
          - { AttributeName: sk, KeyType: RANGE }
        TimeToLiveSpecification:
          AttributeName: expiresAt
          Enabled: true

    SharesTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      Properties:
        TableName: rosterush-${self:provider.stage}-shares
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - { AttributeName: shareId, AttributeType: S }
        KeySchema:
          - { AttributeName: shareId, KeyType: HASH }
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true

    CommentsTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      Properties:
        TableName: rosterush-${self:provider.stage}-comments
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - { AttributeName: pk, AttributeType: S }
          - { AttributeName: sk, AttributeType: S }
        KeySchema:
          - { AttributeName: pk, KeyType: HASH }
          - { AttributeName: sk, KeyType: RANGE }

    RateLimitsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: rosterush-${self:provider.stage}-ratelimits
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - { AttributeName: pk, AttributeType: S }
        KeySchema:
          - { AttributeName: pk, KeyType: HASH }
        TimeToLiveSpecification:
          AttributeName: expiresAt
          Enabled: true

    # ─── 웹 (CloudFront) ───────────────────────────────────────────────────
    # https://{domain}/
    #   /api/*   → API Gateway (비밀 헤더 X-Origin-Verify 추가, 캐시 안 함)
    #   /stats/* → StatsBucket (stats/ 경로만 공개, internal/은 비공개)
    #   /img/*   → ImagesBucket (쉬움 모드 이미지, 직접 업로드)
    #   그 외    → SiteBucket (Next.js 정적 export) + CloudFront Function

    # Next.js 정적 export 결과물
    SiteBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: rosterush-${self:provider.stage}-site-${aws:accountId}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true

    # 쉬움 모드 이미지 (직접 업로드, 웹 배포와 독립)
    # 키는 img/{game}/{파일명}.webp → https://{domain}/img/{game}/{파일명}.webp
    # 웹 배포의 sync --delete에 영향받지 않도록 SiteBucket과 분리. 업로드 실수 복구용으로 버전 관리 켬
    ImagesBucket:
      Type: AWS::S3::Bucket
      DeletionPolicy: Retain
      Properties:
        BucketName: rosterush-${self:provider.stage}-images-${aws:accountId}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        VersioningConfiguration:
          Status: Enabled

    # CloudFront → S3 접근 제어 (버킷은 비공개 유지)
    S3OriginAccessControl:
      Type: AWS::CloudFront::OriginAccessControl
      Properties:
        OriginAccessControlConfig:
          Name: rosterush-${self:provider.stage}-s3
          OriginAccessControlOriginType: s3
          SigningBehavior: always
          SigningProtocol: sigv4

    SiteBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref SiteBucket
        PolicyDocument:
          Statement:
            - Effect: Allow
              Principal: { Service: cloudfront.amazonaws.com }
              Action: s3:GetObject
              Resource: !Sub "${SiteBucket.Arn}/*"
              Condition:
                StringEquals:
                  AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

    StatsBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref StatsBucket
        PolicyDocument:
          Statement:
            - Effect: Allow
              Principal: { Service: cloudfront.amazonaws.com }
              Action: s3:GetObject
              Resource: !Sub "${StatsBucket.Arn}/stats/*"
              Condition:
                StringEquals:
                  AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

    ImagesBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref ImagesBucket
        PolicyDocument:
          Statement:
            - Effect: Allow
              Principal: { Service: cloudfront.amazonaws.com }
              Action: s3:GetObject
              Resource: !Sub "${ImagesBucket.Arn}/img/*"
              Condition:
                StringEquals:
                  AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

    # 뷰어 요청 처리 (웹 기본 경로에만 연결)
    # - "/" → lang 쿠키 > Accept-Language로 /ko/ /ja/ /en/ 302 (미지원 언어는 en)
    # - "/ko/s/{id}" → 공유 페이지 껍데기 /ko/s/index.html
    # - "/ko/genshin/" → /ko/genshin/index.html
    # - "/ko/genshin" (확장자 없음) → "/ko/genshin/" 301
    ViewerRequestFunction:
      Type: AWS::CloudFront::Function
      Properties:
        Name: rosterush-${self:provider.stage}-viewer-request
        AutoPublish: true
        FunctionConfig:
          Comment: language redirect and static export path rewrite
          Runtime: cloudfront-js-2.0
        FunctionCode: |
          var LANGS = ["ko", "ja", "en"];

          function pickLang(req) {
            var cookie = req.cookies.lang && req.cookies.lang.value;
            if (cookie && LANGS.indexOf(cookie) >= 0) return cookie;
            var header = req.headers["accept-language"];
            var parts = header ? header.value.toLowerCase().split(",") : [];
            for (var i = 0; i < parts.length; i++) {
              var code = parts[i].trim().slice(0, 2);
              if (LANGS.indexOf(code) >= 0) return code;
            }
            return "en";
          }

          function query(req) {
            var keys = Object.keys(req.querystring);
            if (!keys.length) return "";
            return "?" + keys.map(function (k) {
              var v = req.querystring[k];
              return v.value === "" ? k : k + "=" + v.value;
            }).join("&");
          }

          function redirect(code, location) {
            return {
              statusCode: code,
              statusDescription: code === 301 ? "Moved Permanently" : "Found",
              headers: {
                location: { value: location },
                "cache-control": { value: code === 301 ? "max-age=3600" : "no-store" },
              },
            };
          }

          function handler(event) {
            var req = event.request;
            var uri = req.uri;

            if (uri === "/") return redirect(302, "/" + pickLang(req) + "/" + query(req));

            var share = uri.match(/^\/(ko|ja|en)\/s\/[^/]+\/?$/);
            if (share) {
              req.uri = "/" + share[1] + "/s/index.html";
              return req;
            }

            if (uri.endsWith("/")) {
              req.uri = uri + "index.html";
              return req;
            }

            var last = uri.slice(uri.lastIndexOf("/") + 1);
            if (last.indexOf(".") === -1) return redirect(301, uri + "/" + query(req));

            return req;
          }

    # API 오리진으로 넘길 헤더: 실제 사용자 IP(CloudFront-Viewer-Address) + 본문 처리용 헤더.
    # Host는 넘기지 않음 (API Gateway가 자기 도메인을 기대함)
    ApiOriginRequestPolicy:
      Type: AWS::CloudFront::OriginRequestPolicy
      Properties:
        OriginRequestPolicyConfig:
          Name: rosterush-${self:provider.stage}-api
          HeadersConfig:
            HeaderBehavior: whitelist
            Headers:
              - CloudFront-Viewer-Address
              - Content-Type
              - Accept
              - Accept-Language
          QueryStringsConfig:
            QueryStringBehavior: all
          CookiesConfig:
            CookieBehavior: none

    Distribution:
      Type: AWS::CloudFront::Distribution
      Properties:
        DistributionConfig:
          Enabled: true
          Comment: rosterush ${self:provider.stage}
          Aliases:
            - ${param:domain}
          ViewerCertificate:
            AcmCertificateArn: ${param:certificateArn}
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          HttpVersion: http2and3
          IPV6Enabled: true
          # PriceClass_100은 한국·일본 엣지를 포함하지 않음
          PriceClass: PriceClass_200
          Origins:
            - Id: site
              DomainName: !GetAtt SiteBucket.RegionalDomainName
              OriginAccessControlId: !GetAtt S3OriginAccessControl.Id
              S3OriginConfig:
                OriginAccessIdentity: ""
            - Id: stats
              DomainName: !GetAtt StatsBucket.RegionalDomainName
              OriginAccessControlId: !GetAtt S3OriginAccessControl.Id
              S3OriginConfig:
                OriginAccessIdentity: ""
            - Id: images
              DomainName: !GetAtt ImagesBucket.RegionalDomainName
              OriginAccessControlId: !GetAtt S3OriginAccessControl.Id
              S3OriginConfig:
                OriginAccessIdentity: ""
            - Id: api
              DomainName: !Sub "${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
              CustomOriginConfig:
                OriginProtocolPolicy: https-only
                OriginSSLProtocols: [TLSv1.2]
              OriginCustomHeaders:
                - HeaderName: X-Origin-Verify
                  HeaderValue: ${param:originVerifySecret}
          DefaultCacheBehavior:
            TargetOriginId: site
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            # Managed-CachingOptimized (오리진 Cache-Control을 따름)
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt ViewerRequestFunction.FunctionMetadata.FunctionARN
          CacheBehaviors:
            - PathPattern: /api/*
              TargetOriginId: api
              ViewerProtocolPolicy: https-only
              AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
              CachedMethods: [GET, HEAD]
              Compress: true
              # Managed-CachingDisabled
              CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
              OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
            - PathPattern: /stats/*
              TargetOriginId: stats
              ViewerProtocolPolicy: redirect-to-https
              Compress: true
              # Managed-CachingOptimized (latest.json 1시간, 스냅샷 1년 — 오리진 Cache-Control 기준)
              CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            - PathPattern: /img/*
              TargetOriginId: images
              ViewerProtocolPolicy: redirect-to-https
              Compress: true
              # Managed-CachingOptimized (업로드 시 Cache-Control: immutable 권장)
              CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6

  Outputs:
    SiteBucketName:
      Value: !Ref SiteBucket
    ImagesBucketName:
      Value: !Ref ImagesBucket
    DistributionId:
      Value: !Ref Distribution
    DistributionDomainName:
      Value: !GetAtt Distribution.DomainName
